<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Sharielle 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Infant:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Background effects -->
    <div id="orbs">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>
    </div>
    <div id="petals"></div>

    <!-- Slots -->
    <div id="slot-login"></div>

    <div id="dash">
        <div id="slot-header"></div>
        <main class="main">
            <div id="slot-welcome"></div>
            <div id="slot-birthday"></div>
            <div id="slot-photos"></div>
            <div id="slot-games"></div>
        </main>
    </div>

    <div id="slot-lightbox"></div>
    <div id="slot-audio"></div>

    <!-- 1. Inject partials into slots (synchronous) -->
    <script src="partials/login.js?v=2"></script>
    <script src="partials/header.js?v=2"></script>
    <script src="partials/welcome.js?v=2"></script>
    <script src="partials/sec-birthday.js?v=2"></script>
    <script src="partials/sec-photos.js?v=2"></script>
    <script src="partials/sec-games.js?v=2"></script>
    <script src="partials/lightbox.js?v=2"></script>
    <script src="partials/audio.js?v=2"></script>

    <!-- 2. App logic (DOM is already populated above) -->
    <script src="js/data.js?v=2"></script>
    <script src="js/music.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/countdown.js?v=2"></script>
    <script src="js/gallery.js?v=2"></script>
    <script src="js/effects.js?v=2"></script>
    <script src="js/loader.js?v=2"></script>

</body>
</html>
